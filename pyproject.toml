[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-data-lakehouse"
version = "0.1.0"
description = "Enterprise data lakehouse using PySpark and Databricks"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyterlab",
    "ipykernel",
    "pandas",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"